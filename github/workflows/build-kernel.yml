name: Build Kernel for Redmi 9T Global

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Free Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h

    - name: Checkout Your Kernel
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y bc bison build-essential ccache curl \
        flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
        libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
        libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
        xsltproc zip zlib1g-dev libelf-dev

    - name: Clone Clang Toolchain
      run: |
        git clone --depth=1 https://gitlab.com/ZyCromerZ/clang-14 clang

    - name: Clone GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"
        export KBUILD_BUILD_USER="NetHunter"
        export KBUILD_BUILD_HOST="GitHub"
        
        # استخدم bengal_defconfig (الصحيح لـ Redmi 9T Global)
        make O=out vendor/bengal_defconfig
        
        # Enable touchscreen and NetHunter features
        cat >> out/.config << 'EOF'
        CONFIG_TOUCHSCREEN_FTS=y
        CONFIG_TOUCHSCREEN_FOCALTECH_FTS=y
        CONFIG_INPUT_TOUCHSCREEN=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WIRELESS_EXT=y
        CONFIG_WEXT_PRIV=y
        CONFIG_WEXT_CORE=y
        CONFIG_WEXT_PROC=y
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_CONFIGFS_F_HID=y
        CONFIG_TUN=y
        CONFIG_PACKET=y
        CONFIG_NETFILTER=y
        EOF
        
        make O=out olddefconfig
        
        # Build kernel
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Verify Build
      run: |
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel built successfully!"
          ls -lh out/arch/arm64/boot/
        else
          echo "❌ Build failed!"
          exit 1
        fi

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3

    - name: Package Kernel
      run: |
        cd AnyKernel3
        rm -rf .git* modules patch ramdisk
        
        cat > anykernel.sh << 'EOF'
        properties() { '
        kernel.string=NetHunter Kernel for Redmi 9T Global (SD662)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=lime
        device.name2=lemon
        device.name3=pomelo
        supported.versions=11-13
        '; }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        
        # نسخ الكيرنل (ملاحظة: قد يكون Image أو Image.gz-dtb)
        if [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ./
        fi
        
        # نسخ dtb و dtbo إذا كانوا موجودين
        [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ] && cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ./
        [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ] && cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ./
        
        zip -r9 ../Kernel-NetHunter-Lime-$(date +%Y%m%d-%H%M).zip * -x '*.git*' README.md

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Redmi9T-Global
        path: Kernel-NetHunter-*.zip

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: out/arch/arm64/boot/Image*
