name: Build Kernel - Redmi 9T Global

on:
  workflow_dispatch:
  push:
    branches: [ thirteen ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y bc bison build-essential ccache curl \
        flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
        libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
        libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
        xsltproc zip zlib1g-dev libelf-dev python3 wget

    - name: Download Clang (من GitHub بدلاً من GitLab)
      run: |
        mkdir clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
        tar -xzf clang-r487747c.tar.gz -C clang
        rm clang-r487747c.tar.gz

    - name: Download GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"
        export KBUILD_BUILD_USER="MohamedBournissa"
        export KBUILD_BUILD_HOST="GitHub"
        
        # Use bengal_defconfig
        make O=out ARCH=arm64 vendor/xiaomi/bengal_defconfig
        
        # Enable critical features
        cat >> out/.config << 'EOF'
        CONFIG_TOUCHSCREEN_FTS=y
        CONFIG_TOUCHSCREEN_FOCALTECH=y
        CONFIG_INPUT_TOUCHSCREEN=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WIRELESS_EXT=y
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_TUN=y
        CONFIG_PACKET=y
        EOF
        
        make O=out ARCH=arm64 olddefconfig
        
        # Build
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          2>&1 | tee build.log

    - name: Check Build
      run: |
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ SUCCESS!"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "❌ FAILED!"
          tail -50 build.log
          exit 1
        fi

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3

    - name: Package ZIP
      run: |
        cd AnyKernel3
        rm -rf .git*
        
        cat > anykernel.sh << 'EOF'
        properties() { '
        kernel.string=Custom Kernel - Redmi 9T Global
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        device.name1=lime
        supported.versions=11-13
        '; }
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        
        cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image* ./ 2>/dev/null || true
        [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ] && cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ./
        
        zip -r9 ../Kernel-$(date +%Y%m%d).zip *

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi9T
        path: Kernel-*.zip
