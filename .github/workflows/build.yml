name: Build Kernel - Redmi 9T (NetHunter)

on:
  workflow_dispatch:
  push:
    branches: [ thirteen ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: thirteen
        fetch-depth: 1

    - name: Free Disk Space
      run: |
        echo "📦 Freeing disk space..."
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
          /usr/local/lib/android /opt/hostedtoolcache
        sudo apt-get clean
        echo "💾 Available space:"
        df -h /

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses5 libncurses5-dev \
          libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev libelf-dev \
          python3 python-is-python3 wget cpio

    - name: Download Clang (ZyCromerZ from GitHub)
      run: |
        echo "⬇️ Downloading ZyCromerZ Clang 15.0.7..."
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz \
          -O clang.tar.gz
        tar -xzf clang.tar.gz -C clang
        rm clang.tar.gz
        echo "✅ Clang downloaded successfully"
        ./clang/bin/clang --version

    - name: Download GCC Toolchains
      run: |
        echo "⬇️ Downloading GCC 4.9 toolchains..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        echo "✅ GCC toolchains ready"

    - name: Setup Build Environment
      run: |
        echo "🔧 Setting up environment..."
        export ARCH=arm64
        export SUBARCH=arm64

        # === Step 1: Use the COMPLETE stock defconfig ===
        make O=out ARCH=arm64 vendor/chime-stock_defconfig

        # === Step 2: Apply chime.config overlay (touchscreen + IR) ===
        cat arch/arm64/configs/vendor/xiaomi/chime.config >> out/.config

        # === Step 3: Add NetHunter / Kali Linux configs ===
        cat >> out/.config << 'NETHUNTER'

        # ============================
        # Kali NetHunter Kernel Config
        # ============================

        # WiFi Monitor Mode (required for aircrack-ng, kismet, etc.)
        CONFIG_MAC80211=y
        CONFIG_CFG80211_WEXT=y
        CONFIG_WEXT_PRIV=y

        # USB Networking (RNDIS + ECM for USB tethering attacks)
        CONFIG_USB_CONFIGFS_RNDIS=y
        CONFIG_USB_CONFIGFS_ECM=y
        CONFIG_USB_CONFIGFS_ECM_SUBSET=y
        CONFIG_USB_CONFIGFS_EEM=y

        # HID Raw Access (keyboard/mouse emulation)
        CONFIG_HIDRAW=y

        # Network Tools Support
        CONFIG_NETFILTER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_IP_NF_IPTABLES=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NF_NAT=y

        # Bluetooth HID
        CONFIG_BT_HIDP=y
        CONFIG_BT_HCIBTUSB=y

        # Additional Packet Injection Support
        CONFIG_PACKET_DIAG=y

        NETHUNTER

        # === Step 4: Resolve config conflicts ===
        make O=out ARCH=arm64 olddefconfig

        echo "✅ Config ready. Key NetHunter configs:"
        echo "---"
        grep -E "CONFIG_MAC80211=|CONFIG_CFG80211_WEXT=|CONFIG_HIDRAW=|CONFIG_USB_CONFIGFS_RNDIS=|CONFIG_USB_CONFIGFS_ECM=|CONFIG_TOUCHSCREEN_NT36672A=|CONFIG_TOUCHSCREEN_FT8719=" out/.config || true

    - name: Build Kernel
      run: |
        echo "🔨 Starting kernel build..."
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"
        export KBUILD_BUILD_USER="MohamedBournissa"
        export KBUILD_BUILD_HOST="GitHub-CI"

        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          2>&1 | tee build.log

        echo ""
        echo "========================================="
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ BUILD SUCCESS!"
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || true
          ls -lh out/arch/arm64/boot/dtb 2>/dev/null || true
          ls -lh out/arch/arm64/boot/dtbo.img 2>/dev/null || true
        else
          echo "❌ BUILD FAILED!"
          echo "Last 100 lines of build log:"
          tail -100 build.log
          exit 1
        fi

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3

    - name: Package Flashable ZIP
      run: |
        cd AnyKernel3
        rm -rf .git* .github modules patch ramdisk

        # Create proper anykernel.sh for Redmi 9T
        cat > anykernel.sh << 'AKSH'
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers
        # Custom Kernel for Redmi 9T - NetHunter Edition

        properties() { '
        kernel.string=NetHunter Kernel by MohamedBournissa
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=lime
        device.name2=chime
        device.name3=citrus
        device.name4=juice
        supported.versions=11-14
        supported.patchlevels=
        '; }

        # Shell variables
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        . tools/ak3-core.sh;

        set_perm_recursive 0 0 755 644 $ramdisk/*;
        dump_boot;

        write_boot;
        AKSH

        # Copy kernel image
        if [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz ./
        elif [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ./
        fi

        # Copy DTB if exists
        [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ] && cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ./
        [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ] && cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ./

        # Create flashable zip
        ZIPNAME="NetHunter-Kernel-Redmi9T-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../${ZIPNAME}" * -x '*.git*'
        echo "📦 Created: ${ZIPNAME}"
        ls -lh "../${ZIPNAME}"

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Redmi9T
        path: NetHunter-Kernel-*.zip
        if-no-files-found: error

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
