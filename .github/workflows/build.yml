name: Build Kernel - Redmi 9T Global

on:
  workflow_dispatch:
  push:
    branches: [ thirteen ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y bc bison build-essential ccache curl \
        flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
        libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
        libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
        xsltproc zip zlib1g-dev libelf-dev python3

    - name: Download Clang
      run: |
        git clone --depth=1 https://gitlab.com/ZyCromerZ/clang-14 clang

    - name: Download GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${GITHUB_WORKSPACE}/clang/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"
        export KBUILD_BUILD_USER="MohamedBournissa"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        # استخدم bengal_defconfig من المسار الصحيح
        make O=out ARCH=arm64 vendor/xiaomi/bengal_defconfig
        
        # تفعيل touchscreen والميزات الضرورية
        cat >> out/.config << 'EOF'
        # Touchscreen Support (CRITICAL!)
        CONFIG_TOUCHSCREEN_FTS=y
        CONFIG_TOUCHSCREEN_FOCALTECH=y
        CONFIG_TOUCHSCREEN_FOCALTECH_FTS=y
        CONFIG_INPUT_TOUCHSCREEN=y
        
        # WiFi Support
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WIRELESS_EXT=y
        CONFIG_WEXT_PRIV=y
        CONFIG_WEXT_CORE=y
        CONFIG_WEXT_PROC=y
        
        # USB OTG
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_CONFIGFS_F_HID=y
        
        # Network
        CONFIG_TUN=y
        CONFIG_PACKET=y
        CONFIG_NETFILTER=y
        EOF
        
        # تطبيق التعديلات
        make O=out ARCH=arm64 olddefconfig
        
        # بناء الكيرنل
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          2>&1 | tee build.log

    - name: Check Build Result
      run: |
        echo "=== Build Output Files ==="
        find out/arch/arm64/boot -type f -name "Image*" -o -name "dtb*" -o -name "*.img"
        
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel Image built successfully!"
          ls -lh out/arch/arm64/boot/Image
        else
          echo "❌ Build failed - no Image found!"
          tail -100 build.log
          exit 1
        fi

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3

    - name: Package Flashable ZIP
      run: |
        cd AnyKernel3
        rm -rf .git* modules patch ramdisk
        
        # إنشاء سكريبت AnyKernel
        cat > anykernel.sh << 'AKEOF'
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers
        
        ### AnyKernel setup
        properties() { '
        kernel.string=Custom Kernel for Redmi 9T Global by MohamedBournissa
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=lime
        device.name2=lemon
        device.name3=pomelo
        device.name4=citrus
        supported.versions=11-13
        supported.patchlevels=
        '; }
        
        ### AnyKernel install
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        
        . tools/ak3-core.sh;
        
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        
        dump_boot;
        write_boot;
        AKEOF
        
        # نسخ ملفات الكيرنل
        if [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "Copying Image.gz-dtb"
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ]; then
          echo "Copying Image"
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image ./
        fi
        
        # نسخ dtb إذا موجود
        if [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtb ./
        fi
        
        # نسخ dtbo إذا موجود
        if [ -f ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ]; then
          cp ${GITHUB_WORKSPACE}/out/arch/arm64/boot/dtbo.img ./
        fi
        
        # إنشاء ZIP
        zip -r9 ../Kernel-Redmi9T-Global-$(date +%Y%m%d-%H%M).zip * -x '*.git*' README.md LICENSE

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Redmi9T-Flashable
        path: Kernel-Redmi9T-Global-*.zip

    - name: Upload Kernel Images
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Images-Only
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtb*
          out/arch/arm64/boot/*.img

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build.log
